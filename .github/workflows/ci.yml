name: Pixelwright CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.14'
          - os: windows-latest
            python: '3.12'
          - os: windows-latest
            python: '3.14'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pixelwright/requirements.txt
      - name: Install runtime dependencies
        run: python -m pip install -r pixelwright/requirements.txt
      - name: Compile Python entry points
        run: python -m py_compile pixelwright/scripts/pixel_build.py pixelwright/scripts/pixel_qa.py pixelwright/scripts/pixelwright.py pixelwright/scripts/pixel_layers.py pixelwright/scripts/pixel_palette.py pixelwright/scripts/pixel_sprite.py tools/package_skill.py tools/verify_release.py tools/generate_sprite_examples.py tools/generate_knight_animations.py tools/knight_pose_guides.py tools/knight_generate_frames.py tools/knight_from_generated.py tools/knight_rig_3d.py tools/knight_render_3d.py tools/knight_sheet_3d.py tools/knight_design_first.py
      - name: Run unit tests
        run: python -m unittest discover -s pixelwright/tests -v
      - name: Build and verify portable packages
        run: python tools/package_skill.py --out-dir .work/ci-dist
      - name: Verify installed release independently
        run: python tools/verify_release.py --archive .work/ci-dist/pixelwright-v0.6.2.zip --out-dir .work/ci-release-check
